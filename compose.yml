version: '3'
services:
  zipkin:
    image: openzipkin/zipkin
    ports:
      - 9411:9411
    networks:
      - ecommerce-net
  service-discovery:
    image: camilin19/service-discovery:latest
    build:
      context: ./service-discovery
    ports:
      - 8761:8761
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
    networks:
      - ecommerce-net
  # cloud-config:
  #   build:
  #     context: ./cloud-config
  #   ports:
  #     - 9296:9296
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=dev  
  #     - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
  api-gateway:
    image: camilin19/api-gateway:latest
    build:
      context: ./api-gateway
    ports:
      - 8080:8080
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/
    networks:
      - ecommerce-net
  proxy-client:
    image: camilin19/proxy-client:latest
    build:
      context: ./proxy-client
    ports:
      - 8900:8900
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  order-service:
    image: camilin19/order-service:latest
    build:
      context: ./order-service
    ports:
      - 8300:8300
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  payment-service:
    image: camilin19/payment-service:latest
    build:
      context: ./payment-service
    ports:
      - 8400:8400
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  product-service:
    image: camilin19/product-service:latest
    build:
      context: ./product-service
    ports:
      - 8500:8500
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  shipping-service:
    image: camilin19/shipping-service:latest
    build:
      context: ./shipping-service
    ports:
      - 8600:8600
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  user-service:
    image: camilin19/user-service:latest
    build:
      context: ./user-service
    ports:
      - 8700:8700
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  favourite-service:
    image: camilin19/favourite-service:latest
    build:
      context: ./favourite-service
    ports:
      - 8800:8800
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # - SPRING_CONFIG_IMPORT=optional:configserver:http://cloud-config:9296
      - SPRING_ZIPKIN_BASE_URL=http://zipkin:9411/
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-discovery:8761/eureka/

    networks:
      - ecommerce-net
  
  newman:
    image: camilin19/newman:latest
    build:
      context: ./newman
    ports:
      - 8901:8901
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge



