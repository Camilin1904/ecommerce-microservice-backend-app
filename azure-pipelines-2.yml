trigger:
-  stage

jobs:

  - job: Deploy_to_stage
    pool:
      vmImage: ubuntu-latest

    steps:

      - task: Maven@3
        inputs:
          mavenPomFile: 'pom.xml'
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '11'
          jdkArchitectureOption: 'x64'
          publishJUnitResults: true
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          goals: 'package'


      - task: Docker@2
        inputs:
          containerRegistry: 'dockerHub'
          command: 'login'


      - task: DockerCompose@1
        inputs:
          containerregistrytype: 'Container Registry'
          dockerRegistryEndpoint: 'dockerHub'
          dockerComposeFile: 'compose.yml'
          projectName: 'ecommerce'
          action: 'Build services'
          includeLatestTag: true

      - task: DockerCompose@1
        inputs:
          containerregistrytype: 'Container Registry'
          dockerRegistryEndpoint: 'dockerHub'
          dockerComposeFile: 'compose.yml'
          projectName: 'ecommerce'
          action: 'Push services'
          includeLatestTag: true

          
      - task: KubectlInstaller@0
        inputs:
          kubectlVersion: 'latest'

      - task: KubernetesManifest@1
        inputs:
          action: 'deploy'
          connectionType: 'azureResourceManager'
          azureSubscriptionConnection: 'ecommerce-connection-manual'
          azureResourceGroup: 'rg-ecommerce-stage'
          kubernetesCluster: 'aks-ecommerce-stage'
          useClusterAdmin: true
          manifests: 'k8s/*.yaml'

      - task: KubernetesManifest@1
        inputs:
          action: 'deploy'
          connectionType: 'azureResourceManager'
          azureSubscriptionConnection: 'ecommerce-connection-manual'
          azureResourceGroup: 'rg-ecommerce-stage'
          kubernetesCluster: 'aks-ecommerce-stage'
          useClusterAdmin: true
          manifests: 'k8s/e2e/e2e.yaml'
          rolloutStatusTimeout: '30'

      - task: Kubernetes@1
        inputs:
          connectionType: 'Azure Resource Manager'
          azureSubscriptionEndpoint: 'ecommerce-connection-manual'
          azureResourceGroup: 'rg-ecommerce-stage'
          useClusterAdmin: true
          kubernetesCluster: 'aks-ecommerce-stage'
          command: 'logs'
          arguments: 'job/newman-job'
          secretType: 'dockerRegistry'
          containerRegistryType: 'Azure Container Registry' 
          

      - task: Kubernetes@1
        inputs:
          connectionType: 'Azure Resource Manager'
          azureSubscriptionEndpoint: 'ecommerce-connection-manual'
          azureResourceGroup: 'rg-ecommerce-stage'
          kubernetesCluster: 'aks-ecommerce-stage'
          useClusterAdmin: true
          command: 'get'
          arguments: 'service api-gateway -o jsonpath=''{.status.loadBalancer.ingress[0].ip}'''
          secretType: 'dockerRegistry'
          containerRegistryType: 'Azure Container Registry'
      
      - task: KubernetesManifest@1
        inputs:
          action: 'deploy'
          connectionType: 'azureResourceManager'
          azureSubscriptionConnection: 'ecommerce-connection-manual'
          azureResourceGroup: 'rg-ecommerce-stage'
          kubernetesCluster: 'aks-ecommerce-stage'
          useClusterAdmin: true
          manifests: 'k8s/locust/stress-dashboard.yaml'

      - task: Kubernetes@1
        inputs:
          connectionType: 'Azure Resource Manager'
          azureSubscriptionEndpoint: 'ecommerce-connection-manual'
          azureResourceGroup: 'rg-ecommerce-stage'
          kubernetesCluster: 'aks-ecommerce-stage'
          useClusterAdmin: true
          command: 'get'
          arguments: 'service stress-dashboard -o jsonpath=''{.status.loadBalancer.ingress[0].ip}'''
          secretType: 'dockerRegistry'
          containerRegistryType: 'Azure Container Registry'


