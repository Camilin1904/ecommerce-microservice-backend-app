apiVersion: batch/v1
kind: Job
metadata:
  name: newman-job
spec:
  template:
    metadata:
      name: newman
    spec:
      restartPolicy: Never
      containers:
        - name: newman
          image: camilin19/newman:latest
          volumeMounts:
            - name: reports
              mountPath: /etc/newman/reports
      volumes:
        - name: reports
          emptyDir: {}